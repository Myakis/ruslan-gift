name: WplanWidgetApp
options:
  bundleIdPrefix: com.wplanwidget.app
  deploymentTarget:
    macOS: "14.0"

packages:
  WplanCore:
    path: ../WplanCore

targets:
  WplanWidgetApp:
    type: application
    platform: macOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WplanAppGroup: "$(DEVELOPMENT_TEAM).com.wplanwidget.app"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wplanwidget.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Wplan"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Приложению нужен доступ к корпоративной сети, чтобы обращаться к Wplan через VPN."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
        DEVELOPMENT_TEAM: 8W787APH48
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "27"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
    dependencies:
      - package: WplanCore
      - sdk: WidgetKit.framework
      - target: WplanWidgetExtension
        embed: true
    entitlements:
      path: App/WplanWidgetApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - "$(DEVELOPMENT_TEAM).com.wplanwidget.app"

  WplanWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wplanwidget.app.widget
        INFOPLIST_FILE: WidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
        DEVELOPMENT_TEAM: 8W787APH48
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "27"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
    dependencies:
      - package: WplanCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    entitlements:
      path: WidgetExtension/WplanWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - "$(DEVELOPMENT_TEAM).com.wplanwidget.app"

schemes:
  WplanWidgetApp:
    build:
      targets:
        WplanWidgetApp: all
    run:
      config: Debug
