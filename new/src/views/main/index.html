<!DOCTYPE html>
<html class="dark" lang="ru">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Главный экран Wplan</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#067bf9",
            "background-light": "#f5f7f8",
            "background-dark": "#0f1923",
            "surface-dark": "#1e2732",
            "border-dark": "#2a3645",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"],
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px",
          },
        },
      },
    };
  </script>
  <style>
    .app-window {
      width: 1200px;
      height: 800px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #4b5563;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: #6b7280;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-900 font-display">
  <div class="app-window flex flex-col bg-background-light dark:bg-background-dark rounded-xl border border-border-dark relative">
    <header class="h-[50px] shrink-0 flex items-center justify-between px-4 bg-white dark:bg-surface-dark border-b border-gray-200 dark:border-border-dark select-none z-20 shadow-sm" id="menu-bar">
      <div class="flex items-center gap-3">
        <div class="flex items-center justify-center size-8 bg-primary/10 rounded-lg">
          <span class="material-symbols-outlined text-primary" style="font-size: 20px;">dataset</span>
        </div>
        <h1 class="text-gray-900 dark:text-white font-bold text-lg tracking-tight">Wplan</h1>
        <div class="ml-2 px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 flex items-center gap-1.5">
          <div class="size-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
          <span class="text-[10px] font-semibold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider">Онлайн</span>
        </div>
      </div>
      <div class="flex-1 h-full mx-4" style="-webkit-app-region: drag;"></div>
      <div class="flex items-center gap-2">
        <button class="group flex items-center justify-center size-8 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-primary/20 hover:text-primary transition-all duration-200" id="settings-btn" title="Настройки">
          <span class="material-symbols-outlined group-hover:rotate-90 transition-transform duration-300" style="font-size: 20px;">settings</span>
        </button>
        <button class="group flex items-center justify-center size-8 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-primary/20 hover:text-primary transition-all duration-200" id="reload-btn" title="Обновить">
          <span class="material-symbols-outlined group-hover:rotate-180 transition-transform duration-500" style="font-size: 20px;">refresh</span>
        </button>
        <div class="w-px h-4 bg-gray-300 dark:bg-gray-700 mx-1"></div>
        <button class="flex items-center justify-center gap-2 h-8 px-3 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-red-50 dark:hover:bg-red-900/20 hover:text-red-600 dark:hover:text-red-400 transition-all duration-200" id="logout-btn" title="Выход">
          <span class="text-xs font-semibold">Выход</span>
          <span class="material-symbols-outlined" style="font-size: 18px;">logout</span>
        </button>
      </div>
    </header>

    <main class="flex-1 bg-[#0b1730] relative">
      <div id="wv-debug" style="position:absolute;top:8px;left:8px;z-index:50;background:rgba(0,0,0,.6);color:#fff;padding:6px 8px;border-radius:6px;font-size:11px;">webview: init</div>
      <electrobun-webview id="wplan-webview" src="https://wplan.office.lan/" style="width:100%;height:100%;display:block;"></electrobun-webview>
    </main>
  </div>

  <style>
    @keyframes loading {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(400%);
      }
    }
  </style>

  <script type="module" src="./index.js"></script>
  <script>
    const dbg = document.getElementById('wv-debug');
    const setDbg = (t) => { if (dbg) dbg.textContent = `webview: ${t}`; };

    document.getElementById('settings-btn').addEventListener('click', () => {
      window.electronAPI?.openSettings?.();
    });
    document.getElementById('reload-btn').addEventListener('click', () => {
      const wv = document.getElementById('wplan-webview');
      if (wv && typeof wv.reload === 'function') {
        wv.reload();
      } else {
        window.location.reload();
      }
    });
    document.getElementById('logout-btn').addEventListener('click', () => {
      window.electronAPI?.logout?.();
    });

    async function setupWebviewAutomation() {
      setDbg('waiting custom element');
      await customElements.whenDefined('electrobun-webview');
      setDbg('custom element ready');
      const wv = document.getElementById('wplan-webview');
      console.log('[wv] exists:', !!wv);
      if (!wv || typeof wv.on !== 'function') {
        setDbg('element not ready/on missing');
        return;
      }

      const injectAutologin = async () => {
        try {
          const creds = await window.electronAPI?.getCredentials?.();
          if (!creds?.username || !creds?.password) return;

          const u = JSON.stringify(creds.username);
          const p = JSON.stringify(creds.password);
          const script = `
            (async function() {
              function waitForElement(selector, timeout = 15000) {
                return new Promise((resolve, reject) => {
                  const initial = document.querySelector(selector);
                  if (initial) return resolve(initial);
                  const observer = new MutationObserver(() => {
                    const found = document.querySelector(selector);
                    if (found) { observer.disconnect(); resolve(found); }
                  });
                  observer.observe(document.body, { childList: true, subtree: true });
                  setTimeout(() => { observer.disconnect(); reject(new Error('timeout')); }, timeout);
                });
              }
              try {
                const loginButton = await waitForElement('#loginButton');
                const usernameField = document.querySelector('input[name="login"]');
                const passwordField = document.querySelector('input[name="password"]');
                if (!usernameField || !passwordField) return;
                const setNativeValue = (el, value) => {
                  const d = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
                  if (d && d.set) d.set.call(el, value); else el.value = value;
                };
                setNativeValue(usernameField, ${u});
                usernameField.dispatchEvent(new Event('input', { bubbles: true }));
                usernameField.dispatchEvent(new Event('change', { bubbles: true }));
                setNativeValue(passwordField, ${p});
                passwordField.dispatchEvent(new Event('input', { bubbles: true }));
                passwordField.dispatchEvent(new Event('change', { bubbles: true }));
                await new Promise(r => setTimeout(r, 150));
                loginButton.click();
              } catch (err) {
                console.error('autologin in webview failed', err);
              }
            })();`;

          if (typeof wv.executeJavascript === 'function') {
            wv.executeJavascript(script);
            console.log('[wv] autologin script injected');
          }
        } catch (err) {
          console.error('[wv] autologin init failed', err);
        }
      };

      wv.on('did-start-loading', () => { console.log('[wv] did-start-loading'); setDbg('did-start-loading'); });
      wv.on('did-stop-loading', () => { console.log('[wv] did-stop-loading'); setDbg('did-stop-loading'); });
      wv.on('dom-ready', async (e) => {
        console.log('[wv] dom-ready', e?.detail ?? '');
        setDbg('dom-ready');
        await injectAutologin();
      });
      wv.on('did-navigate', async () => {
        // повторная попытка после редиректов /sign-in
        await injectAutologin();
      });
      wv.on('did-fail-load', (e) => { console.error('[wv] did-fail-load:', e?.detail ?? e); setDbg('did-fail-load'); });
      wv.on('console-message', (e) => console.log('[wv console]:', e?.detail ?? e));
    }

    setupWebviewAutomation();
    setTimeout(() => {
      if (customElements.get('electrobun-webview')) return;
      setDbg('custom element not registered');
    }, 2000);

    const applySystemTheme = () => {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    };

    applySystemTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);
  </script>
</body>
</html>
