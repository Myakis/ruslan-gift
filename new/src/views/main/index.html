<!DOCTYPE html>
<html class="dark" lang="ru">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Главный экран Wplan</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#067bf9",
            "background-light": "#f5f7f8",
            "background-dark": "#0f1923",
            "surface-dark": "#1e2732",
            "border-dark": "#2a3645",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"],
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px",
          },
        },
      },
    };
  </script>
  <style>
    .app-window { width: 100%; height: 100%; overflow: hidden; }
    .status-chip {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 60;
      background: rgba(2, 6, 23, 0.72);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      font-size: 11px;
      line-height: 1;
      padding: 8px 10px;
      backdrop-filter: blur(6px);
      user-select: none;
    }
  </style>
</head>
<body class="h-screen w-screen bg-gray-900 font-display overflow-hidden">
  <div class="app-window flex flex-col bg-background-light dark:bg-background-dark border border-border-dark relative">
    <header class="h-[50px] shrink-0 flex items-center justify-between px-4 bg-white dark:bg-surface-dark border-b border-gray-200 dark:border-border-dark select-none z-20 shadow-sm" id="menu-bar">
      <div class="flex items-center gap-3">
        <div class="flex items-center justify-center size-8 bg-primary/10 rounded-lg">
          <span class="material-symbols-outlined text-primary" style="font-size: 20px;">dataset</span>
        </div>
        <h1 class="text-gray-900 dark:text-white font-bold text-lg tracking-tight">Wplan</h1>
      </div>
      <div class="flex-1 h-full mx-4" style="-webkit-app-region: drag;"></div>
      <div class="flex items-center gap-2">
        <button class="group flex items-center justify-center size-8 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-primary/20 hover:text-primary transition-all duration-200" id="settings-btn" title="Настройки">
          <span class="material-symbols-outlined group-hover:rotate-90 transition-transform duration-300" style="font-size: 20px;">settings</span>
        </button>
        <button class="group flex items-center justify-center size-8 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-primary/20 hover:text-primary transition-all duration-200" id="reload-btn" title="Обновить">
          <span class="material-symbols-outlined group-hover:rotate-180 transition-transform duration-500" style="font-size: 20px;">refresh</span>
        </button>
        <div class="w-px h-4 bg-gray-300 dark:bg-gray-700 mx-1"></div>
        <button class="flex items-center justify-center gap-2 h-8 px-3 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-red-50 dark:hover:bg-red-900/20 hover:text-red-600 dark:hover:text-red-400 transition-all duration-200" id="logout-btn" title="Выход">
          <span class="text-xs font-semibold">Выход</span>
          <span class="material-symbols-outlined" style="font-size: 18px;">logout</span>
        </button>
      </div>
    </header>

    <main class="flex-1 bg-[#0b1730] relative">
      <electrobun-webview id="wplan-webview" renderer="cef" src="https://wplan.office.lan/" style="width:100%;height:100%;display:block;"></electrobun-webview>
      <div class="status-chip" id="runtime-status">bridge:init · webview:init · autologin:idle</div>
    </main>
  </div>

  <script type="module" src="./index.js"></script>
  <script>
    const statusEl = document.getElementById('runtime-status');
    const status = { bridge: 'init', webview: 'init', autologin: 'idle' };
    const setStatus = (patch) => {
      Object.assign(status, patch);
      if (statusEl) {
        statusEl.textContent = `bridge:${status.bridge} · webview:${status.webview} · autologin:${status.autologin}`;
      }
    };

    const logWarn = (...args) => console.warn('[main-view]', ...args);

    const getWv = () => document.getElementById('wplan-webview') || document.querySelector('electrobun-webview');

    document.getElementById('settings-btn').addEventListener('click', () => window.electronAPI?.openSettings?.());
    document.getElementById('reload-btn').addEventListener('click', () => {
      const wv = getWv();
      if (wv && typeof wv.reload === 'function') {
        wv.reload();
      } else {
        window.location.reload();
      }
    });
    document.getElementById('logout-btn').addEventListener('click', () => window.electronAPI?.logout?.());

    const focusWebview = () => {
      const wv = getWv();
      if (!wv) return;
      if (typeof wv.focus === 'function') wv.focus();
      requestAnimationFrame(() => {
        if (typeof wv.focus === 'function') wv.focus();
      });
    };

    async function setupWebviewAutomation() {
      const bridgeReady = typeof window.electronAPI?.getCredentials === 'function';
      setStatus({ bridge: bridgeReady ? 'ok' : 'missing' });
      if (!bridgeReady) {
        logWarn('RPC bridge missing (window.electronAPI.getCredentials unavailable)');
      }

      await customElements.whenDefined('electrobun-webview');
      const wv = getWv();
      if (!wv || typeof wv.on !== 'function') {
        setStatus({ webview: 'error' });
        logWarn('electrobun-webview element is not ready');
        return;
      }

      let autologinAttempted = false;
      let autologinDone = false;

      const injectAutologin = async (reason) => {
        if (autologinDone) return;
        try {
          const creds = await window.electronAPI?.getCredentials?.();
          if (!creds?.username || !creds?.password) {
            setStatus({ autologin: 'no-cred' });
            return;
          }

          autologinAttempted = true;
          setStatus({ autologin: `try:${reason}` });

          const script = `
            (async function() {
              const selectors = {
                user: ['input[name="login"]', 'input[name="username"]', '#login', '#username'],
                pass: ['input[name="password"]', '#password', 'input[type="password"]'],
                submit: ['#loginButton', 'button[type="submit"]', 'button[name="login"]', '.login-button']
              };

              const pick = (arr) => arr.map((s) => document.querySelector(s)).find(Boolean) || null;
              const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
              const setNativeValue = (el, value) => {
                const d = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
                if (d && d.set) d.set.call(el, value); else el.value = value;
                el.dispatchEvent(new Event('input', { bubbles: true }));
                el.dispatchEvent(new Event('change', { bubbles: true }));
              };

              for (let i = 0; i < 20; i++) {
                const user = pick(selectors.user);
                const pass = pick(selectors.pass);
                const submit = pick(selectors.submit);

                if (user && pass && submit) {
                  setNativeValue(user, ${JSON.stringify(creds.username)});
                  setNativeValue(pass, ${JSON.stringify(creds.password)});
                  await sleep(120);
                  submit.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
                  submit.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
                  submit.dispatchEvent(new MouseEvent('click', { bubbles: true }));
                  return { ok: true, reason: 'submitted' };
                }
                await sleep(250);
              }

              return { ok: false, reason: 'login-form-not-found' };
            })();`;

          if (typeof wv.executeJavascript !== 'function') {
            setStatus({ autologin: 'unsupported' });
            return;
          }

          const result = await wv.executeJavascript(script);
          if (result?.ok) {
            autologinDone = true;
            setStatus({ autologin: 'submitted' });
          } else {
            setStatus({ autologin: result?.reason || 'skip' });
          }
        } catch (err) {
          setStatus({ autologin: 'error' });
          logWarn('autologin injection failed', err);
        }
      };

      const handleReady = async (reason) => {
        setStatus({ webview: reason });
        focusWebview();
        await injectAutologin(reason);
      };

      wv.on('did-start-loading', () => setStatus({ webview: 'loading' }));
      wv.on('dom-ready', () => void handleReady('dom-ready'));
      wv.on('did-stop-loading', () => {
        setStatus({ webview: 'ready' });
        focusWebview();
      });
      wv.on('did-navigate', () => void handleReady('navigate'));
      wv.on('did-fail-load', (e) => {
        setStatus({ webview: 'fail-load' });
        logWarn('webview load failed', e?.detail ?? e);
      });

      wv.addEventListener('mousedown', focusWebview, true);
      wv.addEventListener('mouseenter', focusWebview, true);

      setTimeout(() => {
        if (!autologinAttempted) {
          void injectAutologin('timeout');
        }
      }, 2500);
    }

    setupWebviewAutomation();

    const applySystemTheme = () => {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    };

    applySystemTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySystemTheme);
  </script>
</body>
</html>
