name: Release

# Manual only — run from the Actions tab, on whichever branch you want to
# release from (the current implementation branch included). Creates a git
# tag on that branch, builds a signed .app, packages it as a DMG, and
# publishes both as a GitHub Release. See DEPLOY.md for the one-time setup
# (signing certificate + provisioning profiles as repo secrets).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.2.0-widget"
        required: true

permissions:
  contents: write

jobs:
  release:
    # If the build fails on an SDK/Xcode-version mismatch, pin an explicit
    # runner image (e.g. macos-15) or add an `xcode-select` step for a
    # specific Xcode version — see DEPLOY.md.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd WplanWidgetApp && xcodegen generate

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/ci-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[[:space:]]*"//;s/"$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # Xcode-managed profiles (the only kind a free "Personal Team" account
      # can get — there's no developer portal access to create one manually
      # without a paid Program membership) refuse to work under Manual
      # signing at all (`IsXcodeManaged: true` baked into the profile
      # itself). So this stays on the project's own Automatic signing style
      # — verified locally that once a matching profile+certificate pair is
      # already present, Automatic resolves them with no network/account
      # access needed, which is exactly the CI environment here.
      - name: Install provisioning profiles
        env:
          PROFILE_APP_BASE64: ${{ secrets.MACOS_PROFILE_APP_BASE64 }}
          PROFILE_WIDGET_BASE64: ${{ secrets.MACOS_PROFILE_WIDGET_BASE64 }}
        run: |
          set -euo pipefail
          PROFILES_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROFILE_APP_BASE64" | base64 --decode > "$PROFILES_DIR/ci-app.provisionprofile"
          echo "$PROFILE_WIDGET_BASE64" | base64 --decode > "$PROFILES_DIR/ci-widget.provisionprofile"

      - name: Archive
        run: |
          xcodebuild \
            -project WplanWidgetApp/WplanWidgetApp.xcodeproj \
            -scheme WplanWidgetApp \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Wplan.xcarchive" \
            archive

      - name: Export app
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Wplan.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist WplanWidgetApp/ExportOptions.ci.plist

      - name: Build DMG
        run: |
          ./scripts/build_dmg.sh \
            "$RUNNER_TEMP/export/WplanWidgetApp.app" \
            "$RUNNER_TEMP/Wplan-${{ inputs.version }}.dmg" \
            "Wplan"

      - name: Extract changelog section for this release
        run: |
          awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          if [ ! -s "$RUNNER_TEMP/release_notes.md" ]; then
            echo "_See commit history for this release._" > "$RUNNER_TEMP/release_notes.md"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" \
            "$RUNNER_TEMP/Wplan-${{ inputs.version }}.dmg" \
            --title "${{ inputs.version }}" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            --target "${{ github.ref_name }}"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
